name: Granular LeetCode Sync

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Overwrite existing solution files & single problem READMEs?'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 6"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Granular Sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          OVERWRITE_EXISTING: ${{ inputs.overwrite || 'false' }}
        run: python scripts/sync.py

      - name: Push Commits
        run: git push origin main
